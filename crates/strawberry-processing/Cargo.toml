[package]
name = "strawberry-processing"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "30.0.1"
bytemuck = { version = "1.25", features = ["derive"] }
anyhow = "1.0"
num-traits = "0.2"
image = { git = "https://github.com/maxall41/image.git", branch = "single-channel-support" }
flume = "0.12"
serde = { version = "1.0", features = ["derive", "rc"] }

rayon = "1.12"
futures = "0.3"
smartcore = { git = "https://github.com/maxall41/smartcore.git", branch = "parallel", features = ["serde"] }
tempfile = "3.27"

[lints]
workspace = true
