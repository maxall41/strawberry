[package]
name = "strawberry-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
strawberry-types = { path = "../strawberry-types" }
strawberry-backend = { path = "../strawberry-backend" }
strawberry-processing = { path = "../processing" }
gpui = { git = "https://github.com/maxall41/gpui-m", rev = "0b0eaea6d930b771c93fec0e56b8f5b58f7d5eb5", version = "0.2.2" }
gpui_platform = { git = "https://github.com/maxall41/gpui-m", rev = "0b0eaea6d930b771c93fec0e56b8f5b58f7d5eb5", version = "0.1.0", features = ["font-kit"] }
anyhow = "1.0"
rfd = "0.17"
futures = "0.3"
env_logger = "0.11"
image = { git = "https://github.com/maxall41/image.git", branch = "single-channel-support" }
tokio = { version = "1.53", features = ["full"] }
flume = "0.12"
nucleo-matcher = "0.3.1"
