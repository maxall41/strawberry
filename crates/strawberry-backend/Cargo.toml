[package]
name = "strawberry-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
num-traits = "0.2"
strawberry-types = { path = "../strawberry-types" }
strawberry-processing = { path = "../strawberry-processing" }
anyhow = "1.0"
futures = "0.3"
image = { git = "https://github.com/maxall41/image.git", branch = "single-channel-support" }
tokio = { version = "1.53", features = ["full"] }
flume = "0.12"
async-trait = "0.1.91"
lutz = "1.4.1"
serde = "1.0.229"
serde-value = "0.7"
quick-xml = { version = "0.41.0", features = ["serialize"] }
toml = "1.1.4"

serde_json = "1"
tempfile = "3.27"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
