[package]
name = "strawberry-types"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# Generate in-place struct updates that leave serde(skip) fields untouched.
serde_derive = { version = "1.0", features = ["deserialize_in_place"] }
serde-value = "0.7"
image = { git = "https://github.com/maxall41/image.git", branch = "single-channel-support" }
flume = "0.12"
async-trait = "0.1.91"
anyhow = "1.0"
strawberry-processing = { path = "../strawberry-processing" }
gpui = { git = "https://github.com/maxall41/gpui-m", rev = "0b0eaea6d930b771c93fec0e56b8f5b58f7d5eb5", version = "0.2.2" }

[lints]
workspace = true
