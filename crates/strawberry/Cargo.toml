[package]
name = "strawberry"
version = "0.1.0"
edition = "2021"

[dependencies]
strawberry-processing = { path = "../processing" }
gpui = { git = "https://github.com/maxall41/gpui-m", rev = "a9c8b62f7aa91fe6567d16cf380cd26f99c7758e" }
anyhow = "1.0"
rfd = "0.15"
futures = "0.3"
env_logger = "0.10"
image = { git = "https://github.com/maxall41/image.git", branch = "single-channel-support" }
tokio = { version = "1.0", features = ["full"] }
flume = "0.11"
async-trait = "0.1.88"
lutz = "1.4.1"
serde = "1.0.219"
quick-xml = { version = "0.38.0", features = ["serialize"] }
native-dialog = "0.9.0"
toml = "0.9.2"
clap = { version = "4.5.41", features = ["derive"] }
regex = "1.0"
colored = "2.0"
global-hotkey = "0.7.0"
